# Navn
name: Go CD

# Workflow udløses når CI workflowet afsluttes efter push til main branch
on:
  workflow_run:
    workflows: ["Go CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read


# Sørger for at kun én deployment kører ad gangen, og at nye deployments ikke afbryder igangværende deployments
concurrency:
  group: maxi-knows-production
  cancel-in-progress: false

#Jobbet der skal udføres, med betingelser for at køre
jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}

    runs-on: ubuntu-latest

    # Tager SSH-nøgler og host information fra GitHub secrets, logger ind på Azure VM'en og kører Docker Compose kommandoer for at opdatere applikationen
    steps:

        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Show checkout
        run: ls -l scripts/

      # Hent SSH-nøglen fra GitHub Secrets
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

            # Copy Compose and Nginx configuration to the VM


      - name: Copy deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key \
              "$SSH_USER@$SSH_HOST" \
              'mkdir -p /home/azureuser/maxi-knows/nginx'

          scp -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key \
              compose.yaml \
              "$SSH_USER@$SSH_HOST:/home/azureuser/maxi-knows/compose.yaml"

          scp -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key \
              nginx/nginx.conf \
              "$SSH_USER@$SSH_HOST:/home/azureuser/maxi-knows/nginx/nginx.conf"


      - name: Deploy to Azure VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key \
              "$SSH_USER@$SSH_HOST" \
              'cd /home/azureuser/maxi-knows &&
               sudo -n docker compose pull &&
               sudo -n docker compose up -d'



      # Test the deployed application through HTTPS
      - name: Smoke test on the VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            'for i in $(seq 1 30); do
               if curl -fsS https://maxi-knows.dk/about >/dev/null; then
                 BASE=https://maxi-knows.dk bash -s
                 exit $?
               fi
               sleep 2
             done
             echo "HTTPS endpoint did not become ready"
             exit 1' \
            < scripts/smoke.sh
