
name: Go CD

# Kun manuel start, indtil SSH er testet
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:

        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show checkout
        run: ls -l scripts/

      # Hent SSH-nøglen fra GitHub Secrets
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Log ind på VM'en og udfør en test
      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH CONNECTION SUCCESSFUL" && whoami && hostname'



      # Streams scripts/smoke.sh to the VM and runs it there (read-only mode).
      # Waits up to a minute for the app first, which matters once a deploy
      # step runs before this.
      - name: Smoke test on the VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            'for i in $(seq 1 30); do curl -sf http://localhost:8080/about >/dev/null && break; sleep 2; done; BASE=http://localhost:8080 bash -s' \
            < scripts/smoke.sh