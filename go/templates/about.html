<!--
    Go template rewrite of the original Flask/Jinja about page.
    Changes made in this file:

    - The Jinja extends and title blocks were removed.
      The shared layout is now handled through Go's template system.

    - The Jinja body block:
      {% block body %} ... {% endblock %}
      has been replaced with the Go body template:
      { { define "body" } } ... { { end } }

    - Flask's url_for() for the team image was removed.
      The image is now referenced directly through:
      /static/monkgroup.png

    The page content itself has been kept unchanged from the legacy version.
-->
    

{{ define "body" }}

<h1>Our mission</h1>
<p>We intend to build the world's best search engine!</p>

<h2>Our team</h2>
<img src="/static/monkgroup.png" alt="monk group our team" style="height: 50vh;">

{{ end }}
