
{{ define "body" }}

<h2>Security Notice</h2>

<div class="error">
    <strong>Important Security Update</strong>
    <p>
        We recently experienced a security breach.
        To protect your account, you must change
        your password before continuing.
    </p>
</div>

<h3>Change Your Password</h3>

<form action="/api/change-password" method="POST">
    <dl>
        <dt>
            <label for="new_password">New Password:</label>
        </dt>
        <dd>
            <input
                id="new_password"
                type="password"
                name="new_password"
                autocomplete="new-password"
                required>
        </dd>

        <dt>
            <label for="confirm_password">Confirm Password:</label>
        </dt>
        <dd>
            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                autocomplete="new-password"
                required>
        </dd>
    </dl>

    <div class="actions">
        <input
            type="submit"
            id="change-password-button"
            value="Change Password">
    </div>
</form>

{{ end }}
