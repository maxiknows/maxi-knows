# HTTP - videresend al trafik til HTTPS
server {
    listen 80;
    server_name maxi-knows.dk www.maxi-knows.dk;

    return 301 https://$host$request_uri;
}

# HTTPS - sikker forbindelse til hjemmesiden
server {
    listen 443 ssl;
    server_name maxi-knows.dk www.maxi-knows.dk;

    # Let's Encrypt-certifikat
    ssl_certificate /etc/letsencrypt/live/maxi-knows.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxi-knows.dk/privkey.pem;

    # Send forespørgsler videre til Go-applikationen
    location / {
        proxy_pass http://maxi-knows:8080;

        # Send information om den oprindelige forespørgsel videre
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}